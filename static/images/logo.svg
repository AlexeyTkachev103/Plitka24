<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background square representing a tile -->
  <rect x="2" y="2" width="28" height="28" fill="#2B5AA0" stroke="#1E3F73" stroke-width="1" rx="2"/>

  <!-- Grid pattern to represent ceramic tiles -->
  <rect x="4" y="4" width="12" height="12" fill="#4A90E2" stroke="#FFFFFF" stroke-width="0.5"/>
  <rect x="16" y="4" width="12" height="12" fill="#5BA0F2" stroke="#FFFFFF" stroke-width="0.5"/>
  <rect x="4" y="16" width="12" height="12" fill="#5BA0F2" stroke="#FFFFFF" stroke-width="0.5"/>
  <rect x="16" y="16" width="12" height="12" fill="#4A90E2" stroke="#FFFFFF" stroke-width="0.5"/>

  <!-- Small decorative elements -->
  <circle cx="10" cy="10" r="2" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="22" cy="22" r="2" fill="#FFFFFF" opacity="0.8"/>
</svg>
