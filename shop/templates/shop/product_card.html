<article class="product-card">
    <a class="card-image" href="{{ product.get_absolute_url }}" aria-label="{{ product.name }}">
        <img src="{{ product.image_url }}" alt="" width="620" height="440" loading="lazy">
        {% if product.on_sale %}<span class="sale-tag">Распродажа</span>{% endif %}
    </a>
    <div class="card-content">
        <span class="muted card-meta">{{ product.manufacturer }} · {{ product.article }}</span>
        <h3><a href="{{ product.get_absolute_url }}">{{ product.name }}</a></h3>
        <p class="price">{{ product.price|floatformat:"2g" }} ₽ <small>/ {{ product.get_price_unit_display }}</small></p>
        {% include 'shop/add_to_cart.html' %}
    </div>
</article>
